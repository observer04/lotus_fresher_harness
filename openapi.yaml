openapi: 3.0.3
info:
  title: Canonical Restaurant API
  version: 1.0.0
  description: >-
    OpenAPI-first Restaurant reference backend used to prove the reusable
    OpenAPI + SQLite development harness.
paths:
  /menu:
    get:
      operationId: listMenu
      summary: List the available menu
      description: Return available menu items grouped by category.
      responses:
        '200':
          description: Available menu grouped by category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
  /menu/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getMenuItem
      summary: Read one menu item
      responses:
        '200':
          description: Menu item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers:
    post:
      operationId: createCustomer
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Duplicate email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tables:
    get:
      operationId: listDiningTables
      summary: List active dining tables
      responses:
        '200':
          description: Active dining tables and seat counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiningTableList'
  /reservations:
    post:
      operationId: createReservation
      summary: Create a reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Reservation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The table already has an active reservation for that time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
  /reservations/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getReservation
      summary: Read a reservation
      responses:
        '200':
          description: Reservation details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders:
    post:
      operationId: createOrder
      summary: Create an order transactionally
      description: >-
        The server loads current menu prices from SQLite, calculates every line
        total and the order total, and commits the order and all order_items as
        one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Complete created order with persisted line prices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getOrder
      summary: Read a complete order
      responses:
        '200':
          description: Order with item details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      operationId: updateOrderStatus
      summary: Apply an allowed order status transition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Updated complete order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Status transition is not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
  /customers/{id}/orders:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: listCustomerOrders
      summary: List one customer's order history
      responses:
        '200':
          description: Customer order history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderHistory'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Malformed or incomplete request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Referenced resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BusinessRuleViolation:
      description: Request is syntactically valid but violates a Restaurant business rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    MenuItem:
      type: object
      additionalProperties: false
      required: [id, category_id, name, description, price_cents, available]
      properties:
        id:
          type: integer
          minimum: 1
        category_id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        price_cents:
          type: integer
          minimum: 0
        available:
          type: boolean
    MenuCategory:
      type: object
      additionalProperties: false
      required: [id, name, items]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
    MenuResponse:
      type: object
      additionalProperties: false
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/MenuCategory'
    CreateCustomerRequest:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 3
        phone:
          type: string
          nullable: true
    Customer:
      type: object
      additionalProperties: false
      required: [id, name, email, phone]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 3
        phone:
          type: string
          nullable: true
    DiningTable:
      type: object
      additionalProperties: false
      required: [id, label, seats, active]
      properties:
        id:
          type: integer
          minimum: 1
        label:
          type: string
          minLength: 1
        seats:
          type: integer
          minimum: 1
        active:
          type: boolean
    DiningTableList:
      type: object
      additionalProperties: false
      required: [tables]
      properties:
        tables:
          type: array
          items:
            $ref: '#/components/schemas/DiningTable'
    CreateReservationRequest:
      type: object
      additionalProperties: false
      required: [customer_id, dining_table_id, reservation_time, party_size]
      properties:
        customer_id:
          type: integer
          minimum: 1
        dining_table_id:
          type: integer
          minimum: 1
        reservation_time:
          type: string
          format: date-time
        party_size:
          type: integer
          minimum: 1
    Reservation:
      type: object
      additionalProperties: false
      required: [id, customer_id, dining_table_id, reservation_time, party_size, status]
      properties:
        id:
          type: integer
          minimum: 1
        customer_id:
          type: integer
          minimum: 1
        dining_table_id:
          type: integer
          minimum: 1
        reservation_time:
          type: string
          format: date-time
        party_size:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [CONFIRMED, CANCELLED]
    CreateOrderItem:
      type: object
      additionalProperties: false
      required: [menu_item_id, quantity]
      description: Price is intentionally absent. The backend loads it from SQLite.
      properties:
        menu_item_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        customer_id:
          type: integer
          minimum: 1
          nullable: true
        dining_table_id:
          type: integer
          minimum: 1
          nullable: true
        reservation_id:
          type: integer
          minimum: 1
          nullable: true
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItem'
    OrderItem:
      type: object
      additionalProperties: false
      required: [id, menu_item_id, menu_item_name, quantity, unit_price_cents, line_total_cents]
      properties:
        id:
          type: integer
          minimum: 1
        menu_item_id:
          type: integer
          minimum: 1
        menu_item_name:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        unit_price_cents:
          type: integer
          minimum: 0
        line_total_cents:
          type: integer
          minimum: 0
    OrderStatus:
      type: string
      enum: [NEW, PREPARING, READY, COMPLETED, CANCELLED]
    Order:
      type: object
      additionalProperties: false
      required: [id, customer_id, dining_table_id, reservation_id, status, total_cents, created_at, items]
      properties:
        id:
          type: integer
          minimum: 1
        customer_id:
          type: integer
          minimum: 1
          nullable: true
        dining_table_id:
          type: integer
          minimum: 1
          nullable: true
        reservation_id:
          type: integer
          minimum: 1
          nullable: true
        status:
          $ref: '#/components/schemas/OrderStatus'
        total_cents:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
    UpdateOrderStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
    OrderHistory:
      type: object
      additionalProperties: false
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
